# SmoothPoint Desktop — Release Build
#
# Triggers:
#   - Git tag push: v*  (e.g. v1.0.0) → GitHub Release + installers
#   - Manual: Actions → Release Desktop → Run workflow
#
# Release assets (fixed names for download page):
#   - SmoothPoint-setup.exe  (Windows NSIS)
#   - SmoothPoint.dmg        (macOS)

name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

defaults:
  run:
    working-directory: .

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows
            rust_targets: ""
          - platform: macos-latest
            os_name: macos
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri:build -- ${{ matrix.rust_targets }}
        env:
          CI: true

      - name: Prepare Windows installer (SmoothPoint-setup.exe)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          Copy-Item $exe.FullName -Destination "SmoothPoint-setup.exe"
          Get-Item "SmoothPoint-setup.exe"

      - name: Prepare macOS installer (SmoothPoint.dmg)
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then echo "DMG not found"; exit 1; fi
          cp "$DMG" SmoothPoint.dmg
          ls -la SmoothPoint.dmg

      - name: Upload Windows installer
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: smoothpoint-windows
          path: SmoothPoint-setup.exe

      - name: Upload macOS installer
        if: matrix.os_name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: smoothpoint-macos
          path: SmoothPoint.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: smoothpoint-windows
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoothpoint-macos
          path: dist/macos

      - name: Resolve version tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ github.event.inputs.version || '1.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          if [ -f dist/windows/SmoothPoint-setup.exe ]; then
            cp dist/windows/SmoothPoint-setup.exe release/
          fi
          if [ -f dist/macos/SmoothPoint.dmg ]; then
            cp dist/macos/SmoothPoint.dmg release/
          fi
          if [ -z "$(ls -A release)" ]; then
            echo "No release artifacts"
            exit 1
          fi
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SmoothPoint ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
